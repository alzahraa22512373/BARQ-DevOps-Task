name: barq-assessment
x-app: &app
  build: .
  init: true
  restart: unless-stopped
  environment: &app-env
    APP_HOST: "0.0.0.0"
    APP_PORT: "8080"
    APP_MESSAGE: "Welcome to BARQ Systems"
    DATABASE_URL: "postgresql://${POSTGRES_USER:-barq_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-barq_tasks}"
    REDIS_URL: "redis://redis:6379/0"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "kill -0 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s
  networks: [frontend, backend]
  mem_limit: 256m
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barq_app}
      POSTGRES_DB: ${POSTGRES_DB:-barq_tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barq_app} -d ${POSTGRES_DB:-barq_tasks}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 384m
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks: [backend]
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
  app-01:
    <<: *app
    container_name: app-01
    environment:
      <<: *app-env
      INSTANCE_ID: "app-01"
  app-02:
    <<: *app
    container_name: app-02
    environment:
      <<: *app-env
      INSTANCE_ID: "app-02"
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: nginx
    ports: ["127.0.0.1:${PUBLIC_PORT:-8080}:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app-01:
        condition: service_healthy
      app-02:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks: [frontend]
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
networks:
  frontend:
  backend:
    internal: true
volumes:
  postgres-data:
  redis-data: