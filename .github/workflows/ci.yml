name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run app-only tests
        run: python -m unittest discover -s tests -v

      - name: Check Compose config
        run: docker compose -p barq-assessment config

      - name: Build images
        run: docker compose -p barq-assessment build

      - name: Start environment
        run: docker compose -p barq-assessment up -d

      - name: Validate running environment
        run: python validate.py --project barq-assessment --wait 120

      - name: Show logs on failure
        if: failure()
        run: docker compose -p barq-assessment logs --no-color

      - name: Stop environment
        if: always()
        run: docker compose -p barq-assessment down